name: Test Infrastructure

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PROJECT_NAME: MyProject

jobs:
  # ==========================================================================
  # Lint and Format
  # ==========================================================================
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1 flake8==7.4.1 mypy==2.4.0 pylint==4.1.3
          pip install -r infra/requirements.txt

      - name: Run Black (formatting check)
        run: |
          black --check --diff infra/

      - name: Run Flake8 (linting)
        run: |
          flake8 infra/ --max-line-length=88 --extend-ignore=E203,W503

      - name: Run MyPy (type checking)
        run: |
          mypy infra/ --ignore-missing-imports

  # ==========================================================================
  # CDK Synth Tests
  # ==========================================================================
  cdk-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          npm install -g aws-cdk@2.1145.0

      - name: CDK Synth Test
        env:
          ENV: ${{ matrix.environment }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CDK_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_ACCOUNT: "123456789012"
        run: |
          cd infra
          echo "🔍 Testing CDK synth for environment: $ENV"
          cdk synth --context environment=$ENV
          echo "✅ CDK synth passed for $ENV"

      - name: CDK Diff Test
        env:
          ENV: ${{ matrix.environment }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          CDK_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_ACCOUNT: "123456789012"
        run: |
          cd infra
          cdk diff --context environment=$ENV || true

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # master
        with:
          directory: infra/
          framework: cloudformation
          output_format: sarif
          output_file_path: reports/results.sarif
        continue-on-error: true

      - name: Upload Checkov results to GitHub Security
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2
        if: always()
        with:
          sarif_file: reports/results.sarif
        continue-on-error: true

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1 pytest-cov==7.1.0 moto==5.2.4
          pip install -r infra/requirements.txt

      - name: Run unit tests
        run: |
          if [ -d "tests/" ]; then
            pytest tests/ --cov=infra/ --cov-report=xml --cov-report=html -v
          else
            echo "⚠️ No tests directory found, skipping unit tests"
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
